server.port=8080
spring.application.name=textile

# ------------------------------------------------------------------
# Profile actif : "local" charge application-local.properties (NON versionne).
# C'est ce fichier qui contient les identifiants reels de la base de donnees.
# ------------------------------------------------------------------
spring.profiles.active=local

# ------------------------------------------------------------------
# Base de donnees par defaut : H2 en memoire (aucune installation requise).
# Pour utiliser MariaDB/MySQL en local : creez application-local.properties
# a partir de application-local.properties.example (deja ignores par git).
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:textile;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
